name: att
on: workflow_dispatch
permissions:
  id-token: write
  attestations: write
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: make payload
        run: |
          mkdir -p out
          printf 'bb-team attestation permission-enforcement arm TS=1793139380\n' > out/payload.bin
          echo "MARKER-DIGEST-BEGIN"
          sha256sum out/payload.bin
          echo "MARKER-DIGEST-END"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: out/payload.bin
